name: Build Android APK and Play AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Generate a signed AAB after Play upload-key activation is verified'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.1'
        channel: 'stable'

    - name: Prepare Firebase Android config
      run: cp google-services.json android/app/google-services.json

    # Decodes the keystore OUTSIDE the workspace, so it can never be swept up
    # by actions/upload-artifact, and hands the build its credentials through
    # the environment rather than a .properties file — see the comment at the
    # top of android/app/build.gradle.kts for why that distinction matters.
    - name: Restore release keystore
      id: signing
      if: github.event_name == 'workflow_dispatch' && inputs.release
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        # A signed build is explicitly requested; missing credentials must fail.
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
          || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "::error::Signing secrets incomplete. Configure all four signing values."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
        echo "signed=true" >> "$GITHUB_OUTPUT"

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze

    - name: Test
      run: flutter test

    - name: Read release version
      id: version
      run: echo "version=$(awk '/^version:/ {print $2}' pubspec.yaml)" >> "$GITHUB_OUTPUT"

    # Gradle checks the certificate against Play, not just secret presence.
    - name: Build Play AAB
      if: steps.signing.outputs.signed == 'true'
      env:
        ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: flutter build appbundle --release

    - name: Upload Play AAB
      if: steps.signing.outputs.signed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: master-abap-play-${{ steps.version.outputs.version }}
        path: build/app/outputs/bundle/release/app-release.aab
        if-no-files-found: error

    - name: Build debug APK
      if: steps.signing.outputs.signed != 'true'
      run: flutter build apk --debug

    - name: Upload debug APK (not for Play)
      if: steps.signing.outputs.signed != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: master-abap-debug-not-for-play
        path: build/app/outputs/flutter-apk/app-debug.apk
        if-no-files-found: error

    - name: Clean up signing material
      if: always()
      run: rm -f "$RUNNER_TEMP/release.keystore"

  # Ordinary pushes and pull requests only test/build a debug artifact. Signed
  # distribution needs an explicit manual run and a successful signing guard.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download verified Play AAB
      uses: actions/download-artifact@v4
      with:
        name: master-abap-play-${{ needs.build.outputs.version }}
        path: release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.build.outputs.version }}
        name: Master ABAP v${{ needs.build.outputs.version }}
        body: |
          Master ABAP Mobile App
          ### Google Play upload bundle
          AAB signed with the registered upload key. Upload through Play Console;
          this file cannot be installed directly and is not a published Play release.
          ### Features
          - WebView integration with supabapnew.vercel.app
          - AdMob monetization
          - RevenueCat purchases
        files: |
          release/app-release.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
