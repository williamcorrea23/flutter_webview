# Static analysis for the Master ABAP shell.
#
# Stricter than the stock Flutter template on purpose. This app hands a remote
# website a JavaScript bridge that can start a purchase, create an account and
# hand out a Firebase ID token; an implicit `dynamic` or a dropped Future is
# not a style question here.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # No silent `dynamic`. Bridge handlers receive List<dynamic> from JS, and
    # these force every value out of it to be narrowed explicitly.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Fire-and-forget async is how state changes get lost between the WebView
    # and the services. Treat it as an error, and use unawaited() to say when
    # it is deliberate.
    unawaited_futures: error
    # An unused import or variable after a refactor is noise that hides the
    # real warnings.
    unused_import: error
    unused_local_variable: warning
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_await_in_return
    - use_build_context_synchronously
